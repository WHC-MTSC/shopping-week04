name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: astral-sh/setup-uv@f64d32b1cd6cc11405a74665b3dfb7bb86fea9f0
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run basedpyright
      - run: uv run pytest -q
      - name: Check browser input contracts (Node 20+ on runner)
        run: node --test tests/input.test.mjs
